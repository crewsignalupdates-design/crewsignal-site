name: Audit American-United Pass B live deployment

on:
  push:
    branches:
      - editorial/american-united-pass-b-source-refinement-20261120

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: editorial/american-united-pass-b-source-refinement-20261120
          fetch-depth: 0

      - name: Verify live CrewSignal pages
        env:
          MERGE_SHA: fef3c35d3eea476f974f6ae0eede4e0d97bf2171
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import ssl
          import time
          import urllib.request

          base = "https://crewsignal.org"
          merge_sha = os.environ["MERGE_SHA"]
          pages = {
              "principal": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/",
                  "present": [
                      "This report uses a source-first hierarchy",
                      "$34.294 billion",
                      "199 gates as of April 1, 2026",
                      "Dulles opened Concourse E with 14 new United gates",
                      "Section X.J directs CWA-AFA",
                      "Section 6.B.5 applies when a reschedule, cancellation, or other schedule modification necessitates a hotel",
                  ],
                  "absent": [
                      "current business reporting are treated as established facts",
                      "$26.4 billion of total debt, finance-lease obligations and other financial liabilities",
                      "American’s hotel-delay pay penalties",
                  ],
              },
              "remedy": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/transaction-remedy-labor-scenarios/",
                  "present": [
                      "Illustrative Flight Attendant exposure by base and metropolitan area",
                      "199 O’Hare gates as of April 1, 2026",
                      "Dulles opened Concourse E on November 10, 2026",
                      "Fourteen new United gates opened November 10, 2026",
                  ],
                  "absent": [],
              },
              "seniority": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/seniority-integration-precedents/",
                  "present": [
                      "filed in 2003",
                      "April 9, 2001 date limits",
                      "source-h46",
                      "to the extent legally possible",
                      "Each entry states the proposition supported and material limitations",
                  ],
                  "absent": [
                      "The full private source ledger preserves",
                      "American’s 2002 filing separately said",
                  ],
              },
              "allegheny": {
                  "path": "/reports/merger-integration/reference/allegheny-mohawk/",
                  "present": [
                      "does not prescribe one numerical list or categorically prohibit every endtail",
                      "Primary Authority and Modern Use",
                      "Flight Attendants in Reunion v. American Airlines",
                      "Flight Attendant Seniority Integration Precedents",
                  ],
                  "absent": [
                      "prevents a simple stapling exercise",
                  ],
              },
              "mccaskill": {
                  "path": "/reports/merger-integration/reference/mccaskill-bond/",
                  "present": [
                      "does not prescribe one universal numerical formula",
                      "Primary Authority",
                      "December 26, 2007",
                      "Flight Attendant Seniority Integration Precedents",
                  ],
                  "absent": [
                      "That distinction matters because readers often assume",
                  ],
              },
          }

          context = ssl.create_default_context()

          def fetch_one(name, spec, attempt):
              url = f"{base}{spec['path']}?v={merge_sha}&audit={attempt}-{time.time_ns()}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 CrewSignal-Live-Audit/3.0",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )
              try:
                  with urllib.request.urlopen(req, context=context, timeout=25) as response:
                      body = response.read().decode("utf-8", "replace")
                      headers = dict(response.headers.items())
                      status = response.status
                  present = {m: m in body for m in spec["present"]}
                  absent = {m: m not in body for m in spec["absent"]}
                  return {
                      "name": name,
                      "url": url,
                      "status": status,
                      "bytes": len(body.encode("utf-8")),
                      "age": headers.get("Age"),
                      "cache": headers.get("Cache-Status") or headers.get("X-Cache"),
                      "present": present,
                      "absent": absent,
                      "ok": status == 200 and all(present.values()) and all(absent.values()),
                  }
              except Exception as exc:
                  return {"name": name, "url": url, "error": f"{type(exc).__name__}: {exc}", "ok": False}

          final = None
          for attempt in range(1, 16):
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(pages)) as pool:
                  results = [pool.submit(fetch_one, name, spec, attempt).result() for name, spec in pages.items()]
              results.sort(key=lambda item: item["name"])
              print(f"LIVE_AUDIT_ATTEMPT={attempt}")
              print(json.dumps(results, indent=2, ensure_ascii=False))
              if all(result["ok"] for result in results):
                  final = results
                  break
              time.sleep(5)

          if final is None:
              raise SystemExit("LIVE_AUDIT_FAILED_AFTER_15_ATTEMPTS")

          print(json.dumps({"result": "LIVE_AUDIT_PASS", "merge_sha": merge_sha, "pages": final}, indent=2, ensure_ascii=False))
          PY

      - name: Remove temporary live-audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crewsignalupdates-design"
          git config user.email "crewsignalupdates@gmail.com"
          git rm .github/workflows/audit-au-pass-b-live.yml
          git commit -m "Remove temporary American-United Pass B live audit"
          git push origin HEAD:editorial/american-united-pass-b-source-refinement-20261120
