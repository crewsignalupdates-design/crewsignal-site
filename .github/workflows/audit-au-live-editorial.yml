name: Audit American-United live editorial deployment

on:
  push:
    branches:
      - editorial/american-united-reader-facing-source-corrections-20261106
    paths:
      - .github/workflows/audit-au-live-editorial.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: editorial/american-united-reader-facing-source-corrections-20261106
          fetch-depth: 0

      - name: Verify live CrewSignal pages
        shell: bash
        env:
          MERGE_SHA: a2694714c2865bbdc7fa3abaadd214f0445a5f82
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import ssl
          import sys
          import time
          import urllib.request

          base = "https://crewsignal.org"
          merge_sha = os.environ["MERGE_SHA"]
          pages = {
              "baseline": {
                  "path": "/reports/merger-integration/baseline/",
                  "present": [
                      "Representation, seniority integration, and joint bargaining are distinct legal and contractual tracks",
                      "Flight Attendant Seniority Integration Precedents",
                  ],
                  "absent": [
                      "The certified union must first",
                  ],
              },
              "principal": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/",
                  "present": [
                      "In April 2026, public reporting said United raised the possibility of a combination",
                      "Not combined—reporting definitions differ",
                      "Current CWA-AFA Constitution and Bylaws, amended March 9, 2026",
                      "38 NMB No. 57",
                      "The Pacific sale also transferred a Flight Attendant employment problem",
                      "FY2025 is the full-year scale baseline; Q1 2026 is the announcement-period snapshot; Q3 2026 is the current financial-stress comparison",
                  ],
                  "absent": [
                      "Current company workforce information supplied for this project",
                      "AI-18-Merger-Policy-Section-X.pdf",
                      "The regulatory problem would be extraordinary",
                  ],
              },
              "remedy": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/transaction-remedy-labor-scenarios/",
                  "present": [
                      "Verified sources and explicit scenario assumptions",
                      "Illustrative network result",
                      "Historical operating-unit example",
                      "United does not currently recognize JFK/LGA/EWR as a co-terminal system",
                  ],
                  "absent": [
                      "Source and assumption boundaries preserved",
                      "Likely network result",
                  ],
              },
              "continental": {
                  "path": "/reports/merger-integration/comparators/continental-united/",
                  "present": [
                      "Seniority integration in one view",
                      "The United merger involved three Flight Attendant predecessor groups",
                      "Flight Attendant Seniority Integration Precedents",
                  ],
                  "absent": [],
              },
              "usairways": {
                  "path": "/reports/merger-integration/comparators/us-airways-american/",
                  "present": [
                      "Seniority integration in one view",
                      "APFA and CWA-AFA jointly designed the Flight Attendant seniority process",
                      "Flight Attendant Seniority Integration Precedents",
                  ],
                  "absent": [],
              },
          }

          context = ssl.create_default_context()

          def fetch_one(name, spec, attempt):
              stamp = time.time_ns()
              url = f"{base}{spec['path']}?v={merge_sha}&audit={attempt}-{stamp}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 CrewSignal-Live-Audit/1.0",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )
              try:
                  with urllib.request.urlopen(request, context=context, timeout=25) as response:
                      body = response.read().decode("utf-8", "replace")
                      status = response.status
                      headers = dict(response.headers.items())
                  present = {marker: marker in body for marker in spec["present"]}
                  absent = {marker: marker not in body for marker in spec["absent"]}
                  ok = status == 200 and all(present.values()) and all(absent.values())
                  return {
                      "name": name,
                      "url": url,
                      "status": status,
                      "bytes": len(body.encode("utf-8")),
                      "age": headers.get("Age"),
                      "cache": headers.get("X-Cache") or headers.get("Cache-Status"),
                      "present": present,
                      "absent": absent,
                      "ok": ok,
                  }
              except Exception as exc:
                  return {
                      "name": name,
                      "url": url,
                      "error": f"{type(exc).__name__}: {exc}",
                      "ok": False,
                  }

          final_results = None
          for attempt in range(1, 16):
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(pages)) as pool:
                  futures = [pool.submit(fetch_one, name, spec, attempt) for name, spec in pages.items()]
                  results = [future.result() for future in futures]
              results.sort(key=lambda item: item["name"])
              print(f"LIVE_AUDIT_ATTEMPT={attempt}")
              print(json.dumps(results, indent=2, ensure_ascii=False))
              if all(result["ok"] for result in results):
                  final_results = results
                  break
              time.sleep(5)

          if final_results is None:
              raise SystemExit("LIVE_AUDIT_FAILED_AFTER_15_ATTEMPTS")

          receipt = {
              "result": "LIVE_AUDIT_PASS",
              "merge_sha": merge_sha,
              "pages": final_results,
          }
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          PY

      - name: Remove temporary audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crewsignalupdates-design"
          git config user.email "crewsignalupdates@gmail.com"
          git rm .github/workflows/audit-au-live-editorial.yml
          git commit -m "Remove temporary American-United live audit workflow"
          git push origin HEAD:editorial/american-united-reader-facing-source-corrections-20261106
