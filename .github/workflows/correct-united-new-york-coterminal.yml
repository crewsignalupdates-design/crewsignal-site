name: Correct United New York co-terminal language

on:
  push:
    branches:
      - editorial/correct-united-new-york-coterminal-20261029
    paths:
      - .github/workflows/correct-united-new-york-coterminal.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/correct-united-new-york-coterminal-20261029
          fetch-depth: 0

      - name: Correct New York council and co-terminal language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          companion_path = root / "public/reports/merger-integration/comparators/american-united-hypothetical/transaction-remedy-labor-scenarios/index.html"
          principal_path = root / "public/reports/merger-integration/comparators/american-united-hypothetical/index.html"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          companion = companion_path.read_text(encoding="utf-8")
          principal = principal_path.read_text(encoding="utf-8")

          companion = replace_once(
              companion,
              '''  <p>United's current CBA also defines relevant co-terminal systems: BWI–IAD–DCA, LGA–JFK–EWR, MDW–ORD, OAK–SFO, and BUR–LAX–SNA. Those definitions matter because a remedy or hub reallocation can change reporting, deadhead, transportation, reserve, and reassignment consequences across more than one airport. <a href="https://www.unitedafa.org/hubfs/Updated%20CBA%202026%20Bookmarked%20Single%20Page%20View.pdf?hsLang=en" rel="noopener noreferrer" target="_blank">[R10]</a></p>''',
              '''  <p>United's current CBA defines several relevant co-terminal systems, including BWI–IAD–DCA, MDW–ORD, OAK–SFO, and BUR–LAX–SNA. It does <strong>not</strong> define JFK/LGA/EWR as a current co-terminal system. United's present New York-area Flight Attendant council is Newark (EWR); legacy United previously used a JFK/LGA co-terminal arrangement, but that historical structure is not the current United council or co-terminal framework. The current definitions still matter because a remedy or hub reallocation can change reporting, deadhead, transportation, reserve, and reassignment consequences across more than one airport. <a href="https://www.unitedafa.org/councils" rel="noopener noreferrer" target="_blank">[R9]</a> <a href="https://www.unitedafa.org/hubfs/Updated%20CBA%202026%20Bookmarked%20Single%20Page%20View.pdf?hsLang=en" rel="noopener noreferrer" target="_blank">[R10]</a></p>''',
              "companion co-terminal paragraph",
          )

          companion = replace_once(
              companion,
              '''          <td>American APFA LGA/JFK footprint and United/CWA-AFA Newark council; United recognizes all three airports as co-terminals.</td>''',
              '''          <td>American APFA LGA/JFK footprint and United/CWA-AFA Newark (EWR) council. United does not currently recognize JFK/LGA/EWR as a co-terminal system, and United has no current Flight Attendant council at JFK or LGA.</td>''',
              "companion New York footprint cell",
          )

          companion = replace_once(
              companion,
              '''          <td>Metro-area fence during transition, airport-specific reporting rules, transportation/deadhead protection, and advance notice before changing a Flight Attendant's assigned airport or base.</td>''',
              '''          <td>Because there is no current United JFK/LGA/EWR co-terminal arrangement, any merged-system three-airport treatment would have to be affirmatively negotiated, including airport-specific reporting, transportation, deadhead, reserve, and advance-notice protections.</td>''',
              "companion New York protection cell",
          )

          companion = replace_once(
              companion,
              '''        <tr><td><a href="https://www.unitedafa.org/hubfs/Updated%20CBA%202026%20Bookmarked%20Single%20Page%20View.pdf?hsLang=en" rel="noopener noreferrer" target="_blank">[R10]</a></td><td>United/CWA-AFA CBA Section 2 co-terminal definitions</td><td>Washington, New York, Chicago, San Francisco, and Los Angeles multi-airport systems.</td></tr>''',
              '''        <tr><td><a href="https://www.unitedafa.org/hubfs/Updated%20CBA%202026%20Bookmarked%20Single%20Page%20View.pdf?hsLang=en" rel="noopener noreferrer" target="_blank">[R10]</a></td><td>United/CWA-AFA CBA Section 2 co-terminal definitions</td><td>Washington, Chicago, San Francisco, and Los Angeles multi-airport systems; the current agreement is not cited for a JFK/LGA/EWR co-terminal system.</td></tr>''',
              "companion R10 source description",
          )

          principal = replace_once(
              principal,
              '''<tr><td>Commuter policy</td><td>Commuter policy in Section 37 / related provisions, plus co-terminal language in Section 17.</td><td>Dedicated Commuter Program in Section 28 and co-terminal definitions in Section 2.</td><td>Use the more protective commuter protections by category and include co-terminal treatment for ORD/MDW, JFK/LGA/EWR, DCA/IAD/BWI, LAX/BUR/SNA, and other affected merged-base areas.</td></tr>''',
              '''<tr><td>Commuter policy</td><td>Commuter policy in Section 37 / related provisions, plus co-terminal language in Section 17.</td><td>Dedicated Commuter Program in Section 28 and co-terminal definitions in Section 2.</td><td>Use the more protective commuter protections by category and preserve current co-terminal protections where applicable. If a merged carrier uses Flight Attendant bases or reporting across JFK, LGA, and EWR, any New York three-airport treatment should be expressly negotiated as a new merged-system rule rather than described as a current United co-terminal provision.</td></tr>''',
              "principal combined commuter recommendation",
          )

          companion_path.write_text(companion, encoding="utf-8", newline="\n")
          principal_path.write_text(principal, encoding="utf-8", newline="\n")

          prohibited = {
              companion_path: [
                  "LGA–JFK–EWR",
                  "United recognizes all three airports as co-terminals",
                  "Washington, New York, Chicago, San Francisco, and Los Angeles multi-airport systems",
              ],
              principal_path: [
                  "include co-terminal treatment for ORD/MDW, JFK/LGA/EWR",
              ],
          }
          required = {
              companion_path: [
                  "does <strong>not</strong> define JFK/LGA/EWR as a current co-terminal system",
                  "United's present New York-area Flight Attendant council is Newark (EWR)",
                  "United has no current Flight Attendant council at JFK or LGA",
                  "any merged-system three-airport treatment would have to be affirmatively negotiated",
              ],
              principal_path: [
                  "any New York three-airport treatment should be expressly negotiated as a new merged-system rule",
              ],
          }

          for path in (companion_path, principal_path):
              text = path.read_text(encoding="utf-8")
              for needle in prohibited[path]:
                  if needle in text:
                      raise SystemExit(f"Prohibited stale wording remains in {path}: {needle}")
              for needle in required[path]:
                  if needle not in text:
                      raise SystemExit(f"Required corrected wording missing in {path}: {needle}")

              ids = re.findall(r'\bid="([^"]+)"', text)
              duplicates = sorted({item for item in ids if ids.count(item) > 1})
              if duplicates:
                  raise SystemExit(f"Duplicate IDs in {path}: {duplicates}")

              for tag in ("section", "table", "tbody"):
                  opens = len(re.findall(fr'<{tag}\b', text, flags=re.I))
                  closes = len(re.findall(fr'</{tag}>', text, flags=re.I))
                  if opens != closes:
                      raise SystemExit(f"Unbalanced {tag} tags in {path}: {opens}/{closes}")

          print("United New York co-terminal correction validation PASS")
          PY

          git diff --check
          git status --short

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "CrewSignal Editorial"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/correct-united-new-york-coterminal.yml
          git add \
            public/reports/merger-integration/comparators/american-united-hypothetical/index.html \
            public/reports/merger-integration/comparators/american-united-hypothetical/transaction-remedy-labor-scenarios/index.html
          git commit -m "Correct United New York council and co-terminal language"
          git push origin HEAD:editorial/correct-united-new-york-coterminal-20261029
