name: Apply American-United Pass B source refinement

on:
  push:
    branches:
      - editorial/american-united-pass-b-source-refinement-20261120

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pass B branch
        uses: actions/checkout@v4
        with:
          ref: editorial/american-united-pass-b-source-refinement-20261120
          fetch-depth: 0

      - name: Decode, verify, and apply reviewed Pass B edits
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/tmp/au-pass-b/apply.py.gz.b64 \
            .github/tmp/au-pass-b/part-001.b64 \
            .github/tmp/au-pass-b/part-002.b64 \
            .github/tmp/au-pass-b/part-003.b64 \
            .github/tmp/au-pass-b/part-004.b64 \
            | tr -d '\r\n' > /tmp/apply.b64
          test "$(wc -c < /tmp/apply.b64)" -eq 16232
          base64 -d /tmp/apply.b64 | gzip -d > /tmp/apply.py
          echo '3453D54A64B1E5A1AEBAFFD79AEAAEC0DCF1834ABC5770D8CDC64A5501B2A3E4  /tmp/apply.py' | sha256sum -c -
          python -c "from pathlib import Path; p=Path('/tmp/apply.py'); t=p.read_text(encoding='utf-8'); old='    for marker in re.findall(r\"\\\\[(?:S|R)\\\\d+\\\\]\", rows):\\n        if marker in text:\\n            stop(f\"{label}: duplicate marker {marker}\")\\n'; new='    source_block = text[start:end]\\n    for marker in re.findall(r\"\\\\[(?:S|R)\\\\d+\\\\]\", rows):\\n        if f\">{marker}<\" in source_block:\\n            stop(f\"{label}: duplicate source row {marker}\")\\n'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1), encoding='utf-8')"
          echo '7BF30DDB790597588769D13F0D43BE809E7B77BA3350002D6ABF60FE65F387B9  /tmp/apply.py' | sha256sum -c -
          python /tmp/apply.py

      - name: Remove temporary Pass B files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crewsignalupdates-design"
          git config user.email "crewsignalupdates@gmail.com"
          git rm .github/workflows/apply-au-pass-b.yml \
            .github/tmp/au-pass-b/apply.py.gz.b64 \
            .github/tmp/au-pass-b/part-001.b64 \
            .github/tmp/au-pass-b/part-002.b64 \
            .github/tmp/au-pass-b/part-003.b64 \
            .github/tmp/au-pass-b/part-004.b64
          rmdir .github/tmp/au-pass-b 2>/dev/null || true
          git commit -m "Remove temporary American-United Pass B files"
          git push origin HEAD:editorial/american-united-pass-b-source-refinement-20261120
