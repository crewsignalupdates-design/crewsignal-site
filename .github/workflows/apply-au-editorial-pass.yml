name: Apply American-United editorial pass

on:
  push:
    branches:
      - editorial/american-united-reader-facing-source-corrections-20261106
    paths:
      - .github/workflows/apply-au-editorial-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out editorial branch
        uses: actions/checkout@v4
        with:
          ref: editorial/american-united-reader-facing-source-corrections-20261106
          fetch-depth: 0

      - name: Assemble and run reviewed editorial script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/au-editorial-pass/part-*.b64 > /tmp/apply.b64
          echo 'A29749E5BB1257ED4F89462851E0E8B72CED2FF0F6670F2E2ACE89A0FBAC497F  /tmp/apply.b64' | sha256sum -c -
          base64 -d /tmp/apply.b64 | gzip -d > /tmp/apply.py
          echo '37D66A9FE0C191220C3D412D77446B61F4497BCC6C063D40FEB697790D2B93CB  /tmp/apply.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply.py')
          text = path.read_text(encoding='utf-8')
          old = '''p = replace_once(
              p,
              "The strongest combined governance plan would borrow APFA’s base-centered structure and CWA-AFA’s formal merger machinery.",
              "A transition structure could combine APFA’s base-centered model with CWA-AFA’s formal merger machinery.",
              "P19 governance framing",
          )'''
          new = '''p = replace_once(
              p,
              '<tr><td>Merger infrastructure</td><td>APFA has American/US Airways merger experience and public date-based seniority-integration commitments. <a href="https://www.apfa.org/wp-content/uploads/2014/08/Seniority-Integration-Protocol-with-signatures-as-of-2014.pdf" rel="noopener noreferrer" target="_blank">[S19]</a> <a href="https://www.apfa.org/wp-content/uploads/2013/11/Res4-Occupational-Seniority.pdf" rel="noopener noreferrer" target="_blank">[S20]</a></td><td>CWA-AFA has formal merger policy and United/Continental seniority-integration experience. <a href="https://afacwa.org/wp-content/uploads/2026/03/AI-18-Merger-Policy-Section-X.pdf" rel="noopener noreferrer" target="_blank">[S21]</a> <a href="https://afacwa.org/uaseniority/" rel="noopener noreferrer" target="_blank">[S22]</a></td><td>Both can credibly claim merger experience. The strongest combined governance plan would borrow APFA’s base-centered structure and CWA-AFA’s formal merger machinery.</td></tr>',
              '<tr><td>Merger infrastructure</td><td>APFA has American/US Airways merger experience through a jointly designed APFA/CWA-AFA seniority and representation transition. <a href="https://www.apfa.org/wp-content/uploads/2014/08/Seniority-Integration-Protocol-with-signatures-as-of-2014.pdf" rel="noopener noreferrer" target="_blank">[S19]</a></td><td>CWA-AFA has United/Continental/CMI experience under its adopted merger-policy framework. <a href="https://afacwa.org/wp-content/uploads/2026/07/2026-CB-Amended-March-9-2026-1.pdf" rel="noopener noreferrer" target="_blank">[S21]</a> <a href="https://afacwa.org/uaseniority/" rel="noopener noreferrer" target="_blank">[S22]</a></td><td>Both can credibly claim merger experience. A transition structure could combine APFA’s base-centered representation with CWA-AFA’s formal merger machinery while preserving separately selected legacy-group participation.</td></tr>',
              "P19 governance merger-infrastructure source correction",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'STOP: governance source patch expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          echo '0B404FACCAB67C7925D8B550E543AAD81EE15C7431BD3D731667B3A161F66D00  /tmp/apply.py' | sha256sum -c -
          python /tmp/apply.py
