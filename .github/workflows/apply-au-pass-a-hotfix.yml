name: Apply American-United Pass A accuracy hotfix

on:
  push:
    branches:
      - editorial/american-united-pass-a-accuracy-hotfix-20261120
    paths:
      - .github/workflows/apply-au-pass-a-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: editorial/american-united-pass-a-accuracy-hotfix-20261120
          fetch-depth: 0

      - name: Decode, verify, and apply reviewed hotfix
        shell: bash
        run: |
          set -euo pipefail
          echo '76c31a2bd832cf53651c335783b6e04cc0dfed8cd18bc27d2c669ce7446adcea  .github/tmp/au-pass-a-hotfix/apply.py.gz.b64' | sha256sum -c -
          base64 -d .github/tmp/au-pass-a-hotfix/apply.py.gz.b64 | gzip -d > /tmp/apply-au-pass-a-hotfix.py
          echo 'f8f2ef27375effea35029108acd53d82823161641d9da60b265a4ccd6df7e752  /tmp/apply-au-pass-a-hotfix.py' | sha256sum -c -
          python /tmp/apply-au-pass-a-hotfix.py

      - name: Remove temporary hotfix files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crewsignalupdates-design"
          git config user.email "crewsignalupdates@gmail.com"
          git rm .github/workflows/apply-au-pass-a-hotfix.yml .github/tmp/au-pass-a-hotfix/apply.py.gz.b64
          git commit -m "Remove temporary American-United Pass A hotfix files"
          git push origin HEAD:editorial/american-united-pass-a-accuracy-hotfix-20261120
