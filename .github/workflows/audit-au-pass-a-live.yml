name: Audit American-United Pass A live deployment

on:
  push:
    branches:
      - editorial/american-united-pass-a-accuracy-hotfix-20261120

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: editorial/american-united-pass-a-accuracy-hotfix-20261120
          fetch-depth: 0

      - name: Verify live CrewSignal pages
        env:
          MERGE_SHA: 3c2ec2552a35a88fdf5b5638ab75c1b23f2877c2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import ssl
          import time
          import urllib.request

          base = "https://crewsignal.org"
          merge_sha = os.environ["MERGE_SHA"]
          pages = {
              "baseline": {
                  "path": "/reports/merger-integration/baseline/",
                  "present": [
                      "Certification extension without an election",
                      "30 calendar days",
                      "A showing of interest is evidence that an applicant has enough support",
                  ],
                  "absent": [
                      "Majority absorption occurs when",
                      "A timely SOI can block or delay automatic majority absorption",
                  ],
              },
              "principal": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/",
                  "present": [
                      "No American / United transaction had been publicly announced as of November 20, 2026",
                      "simple uncontested certification-extension case",
                      "LGA–JFK–EWR as New York co-terminals",
                      "54 NMB No. 2",
                  ],
                  "absent": [
                      "current United co-terminal provision",
                      "majority-absorption case",
                      "Rep-Manual-2024-July-1.pdf",
                  ],
              },
              "remedy": {
                  "path": "/reports/merger-integration/comparators/american-united-hypothetical/transaction-remedy-labor-scenarios/",
                  "present": [
                      "LGA–JFK–EWR as co-terminal systems",
                      "American CBA qualification",
                      "two networks combined without divestitures",
                      "54 NMB No. 2",
                  ],
                  "absent": [
                      "does <strong>not</strong> define JFK/LGA/EWR",
                      "the announced combination",
                      "only if employees and operations are transferred",
                  ],
              },
          }

          context = ssl.create_default_context()

          def fetch_one(name, spec, attempt):
              url = f"{base}{spec['path']}?v={merge_sha}&audit={attempt}-{time.time_ns()}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 CrewSignal-Live-Audit/2.0",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )
              try:
                  with urllib.request.urlopen(request, context=context, timeout=25) as response:
                      body = response.read().decode("utf-8", "replace")
                      headers = dict(response.headers.items())
                      status = response.status
                  present = {marker: marker in body for marker in spec["present"]}
                  absent = {marker: marker not in body for marker in spec["absent"]}
                  return {
                      "name": name,
                      "url": url,
                      "status": status,
                      "bytes": len(body.encode("utf-8")),
                      "age": headers.get("Age"),
                      "cache": headers.get("Cache-Status") or headers.get("X-Cache"),
                      "present": present,
                      "absent": absent,
                      "ok": status == 200 and all(present.values()) and all(absent.values()),
                  }
              except Exception as exc:
                  return {"name": name, "url": url, "error": f"{type(exc).__name__}: {exc}", "ok": False}

          final_results = None
          for attempt in range(1, 16):
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(pages)) as pool:
                  results = [pool.submit(fetch_one, name, spec, attempt).result() for name, spec in pages.items()]
              results.sort(key=lambda item: item["name"])
              print(f"LIVE_AUDIT_ATTEMPT={attempt}")
              print(json.dumps(results, indent=2, ensure_ascii=False))
              if all(result["ok"] for result in results):
                  final_results = results
                  break
              time.sleep(5)

          if final_results is None:
              raise SystemExit("LIVE_AUDIT_FAILED_AFTER_15_ATTEMPTS")

          print(json.dumps({"result": "LIVE_AUDIT_PASS", "merge_sha": merge_sha, "pages": final_results}, indent=2, ensure_ascii=False))
          PY

      - name: Remove temporary live-audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "crewsignalupdates-design"
          git config user.email "crewsignalupdates@gmail.com"
          git rm .github/workflows/audit-au-pass-a-live.yml
          git commit -m "Remove temporary American-United Pass A live audit"
          git push origin HEAD:editorial/american-united-pass-a-accuracy-hotfix-20261120
